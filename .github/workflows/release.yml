# Publishes a signed release for every change merged to main, raising the version automatically.
# It never runs for pull requests, so code that has not been merged cannot reach the signing key.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to publish
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          SHOULD_BUILD=true
          if [ "$DRY_RUN" != "true" ] && [ -n "$LATEST" ]; then
            RELEASED_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$LATEST" -q .object.sha 2>/dev/null || true)"
            if [ "$RELEASED_SHA" = "$GITHUB_SHA" ]; then
              echo "This commit is already published as $LATEST. Nothing to do."
              SHOULD_BUILD=false
            fi
          fi
          VERSION="$(node scripts/next-version.mjs "$LATEST")"
          echo "Next version: $VERSION"
          echo "build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # The Linux packages are built on Linux, where the .deb tooling runs natively, then published with the rest.
  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      # Same download folder and cache keys as the Linux CI job, so a release starts from what CI already
      # downloaded instead of asking GitHub again (it sometimes answers 504 for minutes at a time).
      - name: Choose the download folder
        run: |
          echo "electron_config_cache=$RUNNER_TEMP/electron-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-cache/electron-builder" >> "$GITHUB_ENV"

      - name: Restore Electron downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ci-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ci-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
            ci-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the Linux packages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bash scripts/retry.sh npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          bash scripts/retry.sh npx electron-builder --linux AppImage deb --x64 --publish never -c.directories.output=dist

      - name: Check the installed package starts
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb ./dist/SMCP-linux-amd64.deb
          xvfb-run -a node scripts/smoke-test.mjs /opt/SMCP/smcp

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/SMCP-linux-x86_64.AppImage
            dist/SMCP-linux-amd64.deb
          if-no-files-found: error
          retention-days: 3

      - name: Save Electron downloads
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ci-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

  release:
    needs: [plan, linux]
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/build-deps

      - name: Set the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: ${{ runner.temp }}/linux-packages

      - name: Load the signing key
        env:
          SIGNING_KEY: ${{ secrets.SMCP_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SMCP_UPDATE_SIGNING_KEY secret is missing."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/update-signing-key.pem"
          ( umask 077; printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE" )
          echo "SMCP_UPDATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      # The same certificate signs every release, so macOS keeps SMCP's permissions after each update.
      - name: Load the Mac signing certificate
        env:
          CERT_P12: ${{ secrets.SMCP_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SMCP_MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::The SMCP_MAC_CERT_P12 or SMCP_MAC_CERT_PASSWORD secret is missing. Create them with scripts/create-mac-signing-cert.sh."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/smcp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/mac-signing.p12"
          ( umask 077; printf '%s' "$CERT_P12" | base64 --decode > "$P12" )
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate only counts as a signing identity once it is trusted for code signing.
          security find-certificate -c "SMCP Code Signing" -p "$KEYCHAIN" > "$RUNNER_TEMP/mac-signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/mac-signing.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Test, build, sign and publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SMCP_LINUX_PACKAGES: ${{ runner.temp }}/linux-packages
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release.mjs --dry-run
          else
            node scripts/release.mjs
          fi

      - name: Remove the signing keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/update-signing-key.pem" "$RUNNER_TEMP/mac-signing.p12" "$RUNNER_TEMP/mac-signing.pem"
          security delete-keychain "$RUNNER_TEMP/smcp-signing.keychain-db" 2> /dev/null || true

      - name: Save Electron downloads
        if: always()
        uses: ./.github/actions/save-downloads
