# Publishes a signed release when a change on main raises the version in package.json.
# It never runs for pull requests, so code that has not been merged cannot reach the signing key.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether to publish
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHOULD_BUILD=true
          if [ "$DRY_RUN" != "true" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION is already published. Nothing to do."
            SHOULD_BUILD=false
          fi
          echo "build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.build == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          npm ci
          npm run whatsapp:install
          npm run whatsapp:audio-install

      - name: Load the signing key
        if: steps.plan.outputs.build == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SMCP_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SMCP_UPDATE_SIGNING_KEY secret is missing."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/update-signing-key.pem"
          ( umask 077; printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE" )
          echo "SMCP_UPDATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Test, build, sign and publish
        if: steps.plan.outputs.build == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release.mjs --dry-run
          else
            node scripts/release.mjs
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-key.pem"
