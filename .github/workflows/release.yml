# Publishes a signed release for every change merged to main, raising the version automatically.
# It never runs for pull requests, so code that has not been merged cannot reach the signing key.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Decide whether to publish
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          SHOULD_BUILD=true
          if [ "$DRY_RUN" != "true" ] && [ -n "$LATEST" ]; then
            RELEASED_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$LATEST" -q .object.sha 2>/dev/null || true)"
            if [ "$RELEASED_SHA" = "$GITHUB_SHA" ]; then
              echo "This commit is already published as $LATEST. Nothing to do."
              SHOULD_BUILD=false
            fi
          fi
          VERSION="$(node scripts/next-version.mjs "$LATEST")"
          echo "Next version: $VERSION"
          echo "build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # Electron and other packages download binaries from GitHub, which sometimes answers 5xx; retry instead of failing the release.
          retry() {
            for delay in 15 45 90 0; do
              "$@" && return 0
              [ "$delay" = 0 ] && return 1
              echo "::warning::'$*' failed; retrying in ${delay}s."
              sleep "$delay"
            done
          }
          retry npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          retry npm run whatsapp:install
          retry npm run whatsapp:audio-install

      - name: Load the signing key
        if: steps.plan.outputs.build == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SMCP_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SMCP_UPDATE_SIGNING_KEY secret is missing."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/update-signing-key.pem"
          ( umask 077; printf '%s\n' "$SIGNING_KEY" > "$KEY_FILE" )
          echo "SMCP_UPDATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Test, build, sign and publish
        if: steps.plan.outputs.build == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release.mjs --dry-run
          else
            node scripts/release.mjs
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-key.pem"
