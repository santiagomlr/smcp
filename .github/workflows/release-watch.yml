# Opens an issue when main has changes that never made it into a release (for example, the last
# release run failed and nothing triggered another one), and closes it once a release catches up.
name: Release watch

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: release-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that main is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release.sh
