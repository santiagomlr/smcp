# Saves the Electron and electron-builder downloads at the end of a job, even one that failed,
# so a release that hit a GitHub 5xx halfway does not have to download everything again next time.
# Use it as the last step with `if: always()`, after .github/actions/build-deps.
name: Save Electron downloads
description: Saves what Electron and electron-builder downloaded during this job

runs:
  using: composite
  steps:
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
