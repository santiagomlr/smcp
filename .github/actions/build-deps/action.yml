# Installs everything a Mac build needs, reusing what earlier runs already downloaded or compiled.
# The caches are only a speed-up: on a miss every step runs from scratch exactly as before.
name: Build dependencies
description: npm packages, Electron downloads and the native helpers in vendor/bin

runs:
  using: composite
  steps:
    # Electron and electron-builder keep their downloads here (Electron itself, NSIS, dmgbuild, 7zip).
    - name: Restore Electron downloads
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
        restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

    - name: Install npm packages
      shell: bash
      run: bash scripts/retry.sh npm ci

    # wacli, whisper-cli and smcp-nightlight only change when their install script or source changes.
    - name: Restore native helpers
      id: vendor
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: vendor/bin
        key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-wacli.sh', 'scripts/install-whisper.sh', 'scripts/install-nightlight.sh', 'native/**') }}

    - name: Build native helpers
      if: steps.vendor.outputs.cache-hit != 'true'
      shell: bash
      run: |
        bash scripts/retry.sh npm run whatsapp:install
        bash scripts/retry.sh npm run whatsapp:audio-install
        npm run nightlight:install
