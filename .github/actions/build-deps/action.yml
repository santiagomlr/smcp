# Installs everything a Mac build needs, reusing what earlier runs already downloaded or compiled.
# The caches are only a speed-up: on a miss every step runs from scratch exactly as before.
name: Build dependencies
description: npm packages, Electron downloads and the native helpers in vendor/mac-arm64 and vendor/mac-x64

# Electron and electron-builder download most of their tools while packaging, after this action
# has finished, so the job saves that cache itself at the end with .github/actions/save-downloads.

runs:
  using: composite
  steps:
    # Electron and electron-builder keep their downloads here (Electron itself, NSIS, dmgbuild, 7zip, winCodeSign).
    # Every run saves under its own key, so a run that fails halfway still keeps what it managed to download
    # and the next run starts from there instead of from nothing.
    - name: Restore Electron downloads
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
        restore-keys: |
          electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-
          electron-${{ runner.os }}-${{ runner.arch }}-

    - name: Install npm packages
      shell: bash
      run: bash scripts/retry.sh npm ci

    # wacli, whisper-cli and smcp-nightlight only change when their install script or source changes.
    # They are built for both kinds of Mac: vendor/mac-arm64 (Apple Silicon) and vendor/mac-x64 (Intel).
    - name: Restore native helpers
      id: vendor
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: vendor
        key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/mac-arch.sh', 'scripts/install-wacli.sh', 'scripts/install-whisper.sh', 'scripts/install-nightlight.sh', 'native/**') }}

    - name: Build native helpers
      if: steps.vendor.outputs.cache-hit != 'true'
      shell: bash
      run: |
        for arch in arm64 x64; do
          bash scripts/retry.sh npm run whatsapp:install -- "$arch"
          bash scripts/retry.sh npm run whatsapp:audio-install -- "$arch"
          npm run nightlight:install -- "$arch"
        done

    # Saved right away, so a later failure in the job does not throw away a finished whisper.cpp build.
    - name: Save native helpers
      if: steps.vendor.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: vendor
        key: ${{ steps.vendor.outputs.cache-primary-key }}
