<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src data: 'self'" />
    <title>SMCP</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="tray.css" />
  </head>
  <body>
    <template id="mark-template">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect class="mark-warp" x="7.7" y="4.1" width="12.6" height="19.8" rx="2" />
        <rect class="mark-warp" x="43.7" y="4.1" width="12.6" height="19.8" rx="2" />
        <rect class="mark-warp" x="25.7" y="22.1" width="12.6" height="19.8" rx="2" />
        <rect class="mark-warp" x="7.7" y="40.1" width="12.6" height="19.8" rx="2" />
        <rect class="mark-warp" x="43.7" y="40.1" width="12.6" height="19.8" rx="2" />
        <rect class="mark-weft" x="22.1" y="7.7" width="19.8" height="12.6" rx="2" />
        <rect class="mark-weft" x="4.1" y="25.7" width="19.8" height="12.6" rx="2" />
        <rect class="mark-weft" x="40.1" y="25.7" width="19.8" height="12.6" rx="2" />
        <rect class="mark-weft" x="22.1" y="43.7" width="19.8" height="12.6" rx="2" />
      </svg>
    </template>
    <div id="panel" class="panel">
      <header class="panel-head">
        <span id="panel-mark" class="panel-mark"></span>
        <strong>SMCP</strong>
        <span id="panel-status" class="panel-status" role="status"></span>
      </header>
      <div id="p-update" class="panel-update" role="status" hidden>
        <span id="p-update-text"></span>
        <button id="p-update-button" type="button" class="primary">Update</button>
      </div>
      <section aria-labelledby="p-today" class="panel-today">
        <div class="panel-section-head">
          <h2 id="p-today">For today</h2>
          <button id="p-all" type="button" class="quiet">See all</button>
        </div>
        <form id="p-add" class="panel-add">
          <input id="p-add-name" type="text" placeholder="Jot down a task" maxlength="300" autocomplete="off" aria-label="New task" />
        </form>
        <p id="p-add-saved" class="panel-saved" role="status" hidden>Saved to your Inbox</p>
        <ul id="p-tasks" class="panel-tasks"></ul>
        <p id="p-tasks-empty" class="panel-empty" hidden></p>
        <div id="p-undo" class="panel-undo" role="status" hidden>
          <span id="p-undo-text"></span>
          <button id="p-undo-button" type="button" class="quiet">Undo</button>
        </div>
      </section>

      <section id="p-nightlight" aria-labelledby="p-nightlight-title" hidden>
        <div class="panel-section-head">
          <h2 id="p-nightlight-title">Night light</h2>
          <input id="p-nl-enabled" class="switch" type="checkbox" role="switch" aria-label="Night light" />
        </div>
        <div class="panel-nl">
          <input id="p-nl-kelvin" class="nl-range" type="range" min="1000" max="6500" step="100" aria-label="Color temperature right now" />
          <span id="p-nl-value" class="panel-nl-value"></span>
        </div>
        <p class="panel-nl-meta"><span id="p-nl-note"></span><button id="p-nl-resume" type="button" class="quiet" hidden>Back to schedule</button></p>
      </section>

      <section id="p-awake" aria-labelledby="p-awake-title" hidden>
        <div class="panel-section-head">
          <h2 id="p-awake-title">Keep awake</h2>
          <input id="p-aw-enabled" class="switch" type="checkbox" role="switch" aria-label="Keep awake" />
        </div>
        <div class="panel-aw">
          <select id="p-aw-length" aria-label="For how long">
            <option value="0">Until I turn it off</option>
            <option value="60">For 1 hour</option>
            <option value="120">For 2 hours</option>
            <option value="240">For 4 hours</option>
            <option value="480">For 8 hours</option>
            <option value="claude">While Claude is open</option>
          </select>
          <button id="p-aw-screen" type="button" class="quiet">Screen off</button>
        </div>
        <label id="p-aw-lid-row" class="panel-toggle panel-aw-lid" for="p-aw-lid">Lid closed<input id="p-aw-lid" class="switch" type="checkbox" role="switch" /></label>
        <p class="panel-nl-meta"><span id="p-aw-note"></span></p>
        <p id="p-aw-warning" class="panel-aw-warning" role="status" hidden></p>
      </section>

      <section aria-labelledby="p-devices">
        <h2 id="p-devices">Devices</h2>
        <ul id="p-machines" class="panel-list"></ul>
      </section>
      <section aria-labelledby="p-connections">
        <h2 id="p-connections">Connections</h2>
        <ul id="p-connections-list" class="panel-list"></ul>
      </section>
      <footer class="panel-foot">
        <label class="panel-toggle" for="p-pause">Pause SMCP<input id="p-pause" class="switch" type="checkbox" role="switch" /></label>
        <div class="panel-actions">
          <button id="p-open" type="button" class="primary">Open SMCP</button>
          <button id="p-quit" type="button" class="quiet">Quit</button>
        </div>
      </footer>
    </div>
    <script src="i18n.js"></script>
    <script src="i18n/es-settings.js"></script>
    <script src="i18n/es-tasks.js"></script>
    <script src="i18n/es-main.js"></script>
    <script src="i18n/pt-settings.js"></script>
    <script src="i18n/pt-tasks.js"></script>
    <script src="i18n/pt-main.js"></script>
    <script src="i18n/fr-settings.js"></script>
    <script src="i18n/fr-tasks.js"></script>
    <script src="i18n/fr-main.js"></script>
    <script src="i18n/de-settings.js"></script>
    <script src="i18n/de-tasks.js"></script>
    <script src="i18n/de-main.js"></script>
    <script src="i18n/it-settings.js"></script>
    <script src="i18n/it-tasks.js"></script>
    <script src="i18n/it-main.js"></script>
    <script src="nightlight-ui.js"></script>
    <script src="awake-ui.js"></script>
    <script src="tray.js"></script>
  </body>
</html>
